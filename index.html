<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGIS – Fasilitas Kesehatan Manchester, NH</title>
  <meta name="description" content="Peta interaktif fasilitas kesehatan kota Manchester, New Hampshire, berbasis data OpenStreetMap." />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-glass:   rgba(12, 15, 30, 0.82);
      --bg-card:    rgba(20, 24, 46, 0.90);
      --border:     rgba(255, 255, 255, 0.10);
      --accent:     #6366f1;
      --accent2:    #818cf8;
      --text-main:  #e2e8f0;
      --text-muted: #94a3b8;
      --radius:     12px;
      --shadow:     0 8px 32px rgba(0,0,0,.45);

      /* amenity colors */
      --c-hospital: #f43f5e;
      --c-clinic:   #f97316;
      --c-doctors:  #3b82f6;
      --c-pharmacy: #10b981;
      --c-dentist:  #a855f7;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #0f1117;
      color: var(--text-main);
    }

    /* ===== MAP ===== */
    #map {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    /* ===== TOP BAR ===== */
    #topbar {
      position: absolute;
      top: 16px; left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: var(--bg-glass);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      white-space: nowrap;
    }
    #topbar .logo-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    #topbar h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .3px;
    }
    #topbar .separator {
      width: 1px; height: 18px;
      background: var(--border);
    }
    #topbar .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* ===== SIDE PANEL ===== */
    #sidebar {
      position: absolute;
      top: 72px; left: 16px;
      z-index: 1000;
      width: 270px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* Stats */
    #stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-item {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-num {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent2);
      line-height: 1;
    }
    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Filter */
    #filter-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #filter-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
      transition: background .2s;
      font-size: 13px;
      user-select: none;
    }
    #filter-list li:hover { background: rgba(255,255,255,0.06); }
    #filter-list li.active { background: rgba(255,255,255,0.08); }
    .filter-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: opacity .2s;
    }
    #filter-list li.dimmed .filter-dot { opacity: .35; }
    #filter-list li.dimmed .filter-label { opacity: .45; }
    .filter-label { flex: 1; }
    .filter-count {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255,255,255,0.07);
      border-radius: 999px;
      padding: 1px 7px;
    }

    /* Toggle all */
    #toggle-all {
      width: 100%;
      margin-top: 8px;
      padding: 7px;
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.30);
      border-radius: 8px;
      color: var(--accent2);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s;
    }
    #toggle-all:hover { background: rgba(99,102,241,0.25); }

    /* ===== LEGEND (bottom-right) ===== */
    #legend {
      position: absolute;
      bottom: 32px; right: 16px;
      z-index: 1000;
    }
    #legend .card { padding: 14px 16px; }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .legend-item:last-child { margin-bottom: 0; }
    .legend-marker {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px currentColor;
    }

    /* ===== DATA SOURCE badge ===== */
    #datasource {
      position: absolute;
      bottom: 8px; left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      font-size: 10px;
      color: rgba(255,255,255,0.35);
      pointer-events: none;
    }

    /* ===== LEAFLET OVERRIDES ===== */
    .leaflet-popup-content-wrapper {
      background: var(--bg-card) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
      box-shadow: var(--shadow) !important;
      backdrop-filter: blur(20px) !important;
      color: var(--text-main) !important;
      padding: 0 !important;
      max-width: 300px;
    }
    .leaflet-popup-tip {
      background: rgba(20, 24, 46, 0.95) !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
    }
    .popup-inner {
      padding: 14px 16px;
    }
    .popup-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .popup-type-badge {
      flex-shrink: 0;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-top: 2px;
    }
    .popup-name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-main);
    }
    .popup-attr-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .popup-attr-table tr td {
      padding: 4px 0;
      vertical-align: top;
    }
    .popup-attr-table tr td:first-child {
      color: var(--text-muted);
      width: 42%;
      padding-right: 8px;
      font-weight: 500;
    }
    .popup-attr-table tr td:last-child {
      color: var(--text-main);
      word-break: break-word;
    }
    .popup-attr-table tr:not(:last-child) td {
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .leaflet-popup-close-button {
      color: var(--text-muted) !important;
      font-size: 18px !important;
      top: 8px !important;
      right: 10px !important;
    }
    .leaflet-popup-close-button:hover { color: var(--text-main) !important; }

    .leaflet-control-zoom {
      border: none !important;
    }
    .leaflet-control-zoom a {
      background: var(--bg-card) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      margin-bottom: 4px !important;
      width: 32px !important;
      height: 32px !important;
      line-height: 30px !important;
      font-size: 16px !important;
      backdrop-filter: blur(12px) !important;
    }
    .leaflet-control-zoom a:hover { background: rgba(99,102,241,0.25) !important; }
    .leaflet-control-attribution {
      background: rgba(12,15,30,0.75) !important;
      color: rgba(255,255,255,0.4) !important;
      font-size: 10px !important;
      border-radius: 6px 0 0 0 !important;
    }
    .leaflet-control-attribution a { color: rgba(255,255,255,0.5) !important; }

    /* custom circle marker pulse on hover */
    .leaflet-interactive:hover { cursor: pointer; }

    /* Loading overlay */
    #loading {
      position: absolute;
      inset: 0;
      z-index: 2000;
      background: #0f1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity .5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(99,102,241,0.2);
      border-top-color: var(--accent2);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Responsive: hide sidebar on small screens */
    @media (max-width: 600px) {
      #sidebar { width: 200px; }
      #topbar h1 { display: none; }
    }
  </style>
</head>
<body>

<!-- Loading Screen -->
<div id="loading">
  <div class="spinner"></div>
  <p>Memuat data peta…</p>
</div>

<!-- Map -->
<div id="map"></div>

<!-- Top Bar -->
<div id="topbar">
  <div class="logo-icon">🏥</div>
  <h1>WebGIS Fasilitas Kesehatan</h1>
  <div class="separator"></div>
  <span class="subtitle">Manchester, New Hampshire · OSM Data</span>
</div>

<!-- Sidebar -->
<div id="sidebar">

  <!-- Stats Card -->
  <div class="card">
    <div class="card-title">📊 Statistik Data</div>
    <div id="stats-grid">
      <div class="stat-item">
        <div class="stat-num" id="stat-total">–</div>
        <div class="stat-label">Total Fitur</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="stat-shown">–</div>
        <div class="stat-label">Ditampilkan</div>
      </div>
    </div>
  </div>

  <!-- Filter Card -->
  <div class="card">
    <div class="card-title">🔍 Filter Tipe Fasilitas</div>
    <ul id="filter-list"></ul>
    <button id="toggle-all">Tampilkan / Sembunyikan Semua</button>
  </div>

</div>

<!-- Legend -->
<div id="legend">
  <div class="card">
    <div class="card-title">🗺 Legenda</div>
    <div class="legend-item"><div class="legend-marker" style="background:var(--c-hospital);"></div> Rumah Sakit</div>
    <div class="legend-item"><div class="legend-marker" style="background:var(--c-clinic);"></div> Klinik</div>
    <div class="legend-item"><div class="legend-marker" style="background:var(--c-doctors);"></div> Dokter</div>
    <div class="legend-item"><div class="legend-marker" style="background:var(--c-pharmacy);"></div> Apotek</div>
    <div class="legend-item"><div class="legend-marker" style="background:var(--c-dentist);"></div> Dokter Gigi</div>
  </div>
</div>

<!-- Attribution -->
<div id="datasource">© OpenStreetMap Contributors | Exported via HOT Raw Data API</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
const GEOJSON_PATH = 'data/task_6.geojson';

const AMENITY_CONFIG = {
  hospital: { label: 'Rumah Sakit', color: '#f43f5e', radius: 11, emoji: '🏥' },
  clinic:   { label: 'Klinik',      color: '#f97316', radius: 9,  emoji: '🏨' },
  doctors:  { label: 'Dokter',      color: '#3b82f6', radius: 8,  emoji: '👨‍⚕️' },
  pharmacy: { label: 'Apotek',      color: '#10b981', radius: 8,  emoji: '💊' },
  dentist:  { label: 'Dokter Gigi', color: '#a855f7', radius: 8,  emoji: '🦷' },
};

const ATTR_LABELS = {
  osm_id:               'OSM ID',
  osm_type:             'Tipe OSM',
  name:                 'Nama',
  amenity:              'Tipe Fasilitas',
  operator:             'Operator',
  operator_type:        'Tipe Operator',
  status:               'Status',
  opening_hours:        'Jam Buka',
  access:               'Akses',
  health_facility_type: 'Tipe Fasilitas Kes.',
  health_facility_level:'Level Fasilitas',
  health_facility_bed:  'Jumlah Tempat Tidur',
  medical_system_western: 'Sistem Medis',
  staff_count_doctors:  'Jml. Dokter',
  staff_count_nurses:   'Jml. Perawat',
  toilets_disposal:     'Pengelolaan Toilet',
  toilets_handwashing:  'Cuci Tangan',
};

// ─── MAP INIT ──────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [42.990, -71.455],
  zoom: 13,
  zoomControl: false,
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

// Custom zoom position
L.control.zoom({ position: 'bottomleft' }).addTo(map);

// ─── STATE ─────────────────────────────────────────────────────────────────
let allLayers   = {};   // { amenity: L.LayerGroup }
let activeTypes = {};   // { amenity: true/false }
let totalCount  = 0;
let countByType = {};   // { amenity: n }

// ─── HELPERS ───────────────────────────────────────────────────────────────
function getConfig(amenity) {
  return AMENITY_CONFIG[amenity] || { label: amenity, color: '#64748b', radius: 8, emoji: '📍' };
}

function buildPopupHTML(props) {
  const cfg = getConfig(props.amenity);
  const name = props.name || '<em style="color:#64748b">Tanpa Nama</em>';

  // Build attribute rows (skip null/undefined/empty)
  const skip = ['name', 'amenity'];
  let rows = '';
  for (const [key, label] of Object.entries(ATTR_LABELS)) {
    if (skip.includes(key)) continue;
    const val = props[key];
    if (val === null || val === undefined || val === '') continue;
    rows += `<tr>
      <td>${label}</td>
      <td>${val}</td>
    </tr>`;
  }

  return `
    <div class="popup-inner">
      <div class="popup-header">
        <div>
          <div class="popup-name">${name}</div>
        </div>
        <span class="popup-type-badge"
          style="background:${cfg.color}22; color:${cfg.color}; border:1px solid ${cfg.color}44;">
          ${cfg.emoji} ${cfg.label}
        </span>
      </div>
      ${rows ? `<table class="popup-attr-table">${rows}</table>` : '<p style="color:#64748b;font-size:12px;">Tidak ada atribut tambahan.</p>'}
    </div>`;
}

function createMarker(feature, latlng) {
  const amenity = feature.properties.amenity || 'unknown';
  const cfg = getConfig(amenity);

  const marker = L.circleMarker(latlng, {
    radius: cfg.radius,
    fillColor: cfg.color,
    color: '#0f1117',
    weight: 2,
    opacity: 1,
    fillOpacity: 0.88,
  });

  marker.on('mouseover', function() {
    this.setStyle({ weight: 3, color: cfg.color, fillOpacity: 1 });
    this.setRadius(cfg.radius + 2);
  });
  marker.on('mouseout', function() {
    this.setStyle({ weight: 2, color: '#0f1117', fillOpacity: 0.88 });
    this.setRadius(cfg.radius);
  });

  marker.bindPopup(buildPopupHTML(feature.properties), {
    maxWidth: 300,
    className: 'custom-popup',
  });

  return marker;
}

function createPolygon(feature, layer) {
  const amenity = feature.properties.amenity || 'unknown';
  const cfg = getConfig(amenity);

  layer.setStyle({
    fillColor: cfg.color,
    color: cfg.color,
    weight: 2,
    opacity: .85,
    fillOpacity: .30,
  });

  layer.on('mouseover', function() {
    this.setStyle({ weight: 3, fillOpacity: .50 });
  });
  layer.on('mouseout', function() {
    this.setStyle({ weight: 2, fillOpacity: .30 });
  });

  layer.bindPopup(buildPopupHTML(feature.properties), {
    maxWidth: 300,
    className: 'custom-popup',
  });

  return layer;
}

// ─── FILTER UI ─────────────────────────────────────────────────────────────
function buildFilterUI() {
  const ul = document.getElementById('filter-list');
  ul.innerHTML = '';

  for (const [amenity, cfg] of Object.entries(AMENITY_CONFIG)) {
    const count = countByType[amenity] || 0;
    if (count === 0) continue;

    activeTypes[amenity] = true;

    const li = document.createElement('li');
    li.id = `filter-${amenity}`;
    li.classList.add('active');
    li.innerHTML = `
      <div class="filter-dot" style="background:${cfg.color};box-shadow:0 0 6px ${cfg.color}88;"></div>
      <span class="filter-label">${cfg.emoji} ${cfg.label}</span>
      <span class="filter-count">${count}</span>
    `;
    li.addEventListener('click', () => toggleFilter(amenity, li));
    ul.appendChild(li);
  }
}

function toggleFilter(amenity, li) {
  activeTypes[amenity] = !activeTypes[amenity];

  if (activeTypes[amenity]) {
    li.classList.add('active');
    li.classList.remove('dimmed');
    if (allLayers[amenity]) map.addLayer(allLayers[amenity]);
  } else {
    li.classList.remove('active');
    li.classList.add('dimmed');
    if (allLayers[amenity]) map.removeLayer(allLayers[amenity]);
  }
  updateStatShown();
}

let allShown = true;
document.getElementById('toggle-all').addEventListener('click', () => {
  allShown = !allShown;
  for (const amenity of Object.keys(allLayers)) {
    const li = document.getElementById(`filter-${amenity}`);
    if (!li) continue;
    activeTypes[amenity] = allShown;
    if (allShown) {
      li.classList.add('active'); li.classList.remove('dimmed');
      map.addLayer(allLayers[amenity]);
    } else {
      li.classList.remove('active'); li.classList.add('dimmed');
      map.removeLayer(allLayers[amenity]);
    }
  }
  updateStatShown();
});

function updateStatShown() {
  let shown = 0;
  for (const [amenity, active] of Object.entries(activeTypes)) {
    if (active) shown += countByType[amenity] || 0;
  }
  document.getElementById('stat-shown').textContent = shown;
}

// ─── LOAD GEOJSON ──────────────────────────────────────────────────────────
fetch(GEOJSON_PATH)
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(geojson => {
    // Group features by amenity type
    const groups = {};

    geojson.features.forEach(f => {
      const amenity = (f.properties && f.properties.amenity) || 'unknown';
      if (!groups[amenity]) groups[amenity] = [];
      groups[amenity].push(f);
      totalCount++;
    });

    // Create layer groups per amenity
    for (const [amenity, features] of Object.entries(groups)) {
      countByType[amenity] = features.length;

      const layerGroup = L.geoJSON({ type: 'FeatureCollection', features }, {
        pointToLayer: (feature, latlng) => createMarker(feature, latlng),
        onEachFeature: (feature, layer) => {
          if (feature.geometry.type !== 'Point') {
            createPolygon(feature, layer);
          }
        },
      });

      allLayers[amenity] = layerGroup;
      layerGroup.addTo(map);
    }

    // Stats
    document.getElementById('stat-total').textContent = totalCount;
    document.getElementById('stat-shown').textContent = totalCount;

    // Filter UI
    buildFilterUI();

    // Fit bounds
    const allGeo = L.geoJSON(geojson);
    if (allGeo.getBounds().isValid()) {
      map.fitBounds(allGeo.getBounds(), { padding: [60, 60] });
    }

    // Hide loading
    const loading = document.getElementById('loading');
    loading.classList.add('hidden');
    setTimeout(() => loading.remove(), 600);
  })
  .catch(err => {
    document.querySelector('#loading p').textContent =
      `Gagal memuat data: ${err.message}. Pastikan file GeoJSON tersedia.`;
    console.error(err);
  });
</script>
</body>
</html>
